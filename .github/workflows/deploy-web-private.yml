name: Deploy Web - Private Preview

on:
  push:
    branches: [main, develop]
    paths:
      - 'SKILLBRIDGE/apps/web/**'
      - '.github/workflows/deploy-web-private.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'SKILLBRIDGE/apps/web/**'
      - '.github/workflows/deploy-web-private.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-private-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-web-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: SKILLBRIDGE/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: SKILLBRIDGE

      - name: Lint SkillBridge Web App
        run: npm run lint --workspace=@skillbridge/web
        working-directory: SKILLBRIDGE

      - name: Type Check SkillBridge Web App
        run: npm run type-check --workspace=@skillbridge/web
        working-directory: SKILLBRIDGE

      - name: Build SkillBridge Main Workspace
        run: npx turbo run build --filter=@skillbridge/web
        working-directory: SKILLBRIDGE

      - name: Test SkillBridge Web App
        run: npm run test --workspace=@skillbridge/web
        working-directory: SKILLBRIDGE

  deploy-web-private:
    needs: validate-web-preview
    if: ${{ github.event_name != 'pull_request' && vars.ENABLE_NETLIFY_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: web-private-netlify
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Deploy SkillBridge to Netlify preview
        uses: netlify/actions/cli@master
        with:
          args: deploy --build --alias=${{ github.ref_name }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
