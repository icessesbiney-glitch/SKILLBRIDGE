name: Deploy Web - Private Preview

on:
  push:
    branches: [develop]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'netlify.toml'
      - '.github/workflows/deploy-web-private.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'netlify.toml'
      - '.github/workflows/deploy-web-private.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-private-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-web-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Turborepo Validation Pipeline
        run: npx turbo run build lint test

  deploy-web-private:
    needs: validate-web-preview
    if: ${{ github.event_name != 'pull_request' && secrets.NETLIFY_AUTH_TOKEN != '' && secrets.NETLIFY_SITE_ID != '' }}
    runs-on: ubuntu-latest
    environment: web-private-netlify
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Deploy to Netlify preview
        uses: netlify/actions/cli@master
        with:
          args: deploy --build --alias=${{ github.ref_name }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
