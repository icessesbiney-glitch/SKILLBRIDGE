name: Deploy Web - Private Preview

on:
  push:
    branches: [develop]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'netlify.toml'
      - '.github/workflows/deploy-web-private.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'netlify.toml'
      - '.github/workflows/deploy-web-private.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-private-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-web-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Lint web app
        run: npm run lint --workspace=@skillbridge/web

      - name: Type check web app
        run: npm run type-check --workspace=@skillbridge/web

      - name: Test web app
        run: npm run test --workspace=@skillbridge/web

  deploy-web-private:
    needs: validate-web-preview
    if: ${{ github.event_name != 'pull_request' && secrets.NETLIFY_AUTH_TOKEN != '' && secrets.NETLIFY_SITE_ID != '' }}
    runs-on: ubuntu-latest
    environment: web-private-netlify
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Netlify preview
        uses: netlify/actions/cli@master
        with:
          args: deploy --build --alias=${{ github.ref_name }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Comment on commit
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '✅ Private web preview deployed to Netlify\n\n🔒 This preview is intended for internal review on the develop branch.'
            })
