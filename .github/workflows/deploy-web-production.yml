name: Deploy Web - Production (Public)

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web-production.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-public-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-web-production:
    if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    environment: web-public-vercel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint SkillBridge Web App
        run: npm run lint --workspace=@skillbridge/web

      - name: Type Check SkillBridge Web App
        run: npm run type-check --workspace=@skillbridge/web

      - name: Build SkillBridge Main Workspace
        run: npx turbo run build --filter=@skillbridge/web

      - name: Test SkillBridge Web App
        run: npm run test --workspace=@skillbridge/web

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          vercel-args: '--prod'
          working-directory: apps/web
