name: Deploy Web - Production (Public)

on:
  push:
    branches: [main]
    paths:
      - 'SKILLBRIDGE/apps/web/**'
      - 'SKILLBRIDGE/package.json'
      - 'SKILLBRIDGE/package-lock.json'
      - '.github/workflows/deploy-web-production.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-public-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-web-production:
    runs-on: ubuntu-latest
    environment: web-public-vercel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: SKILLBRIDGE/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: SKILLBRIDGE

      - name: Lint SkillBridge Web App
        run: npm run lint --workspace=@skillbridge/web
        working-directory: SKILLBRIDGE

      - name: Type Check SkillBridge Web App
        run: npm run type-check --workspace=@skillbridge/web
        working-directory: SKILLBRIDGE

      - name: Build SkillBridge Main Workspace
        run: npx turbo run build --filter=@skillbridge/web
        working-directory: SKILLBRIDGE

      - name: Test SkillBridge Web App
        run: npm run test --workspace=@skillbridge/web
        working-directory: SKILLBRIDGE

      - name: Deploy to Vercel (Production)
        working-directory: SKILLBRIDGE/apps/web
        run: npx vercel@latest --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
