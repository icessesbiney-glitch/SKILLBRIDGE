name: Deploy Web Surface (Production)
on:
  push:
    branches: [main]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Root Workspace Dependencies
        env:
          NEXT_DISABLE_LOCKFILE_PATCH: "true"
        run: npm install

      - name: Compile Target Web Build via Turborepo Execution
        env:
          NEXT_DISABLE_LOCKFILE_PATCH: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx turbo run build --filter=@skillbridge/web
