name: Deploy Web - Production (Public)

on:
  push:
    branches: [main]
    paths:
      - 'SKILLBRIDGE/apps/web/**'
      - 'SKILLBRIDGE/package.json'
      - 'SKILLBRIDGE/package-lock.json'
      - '.github/workflows/deploy-web-production.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-public-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-web-production:
    runs-on: ubuntu-latest
    environment: web-public-vercel
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_nLN657ZMe6wupW9HNdm6DQ_44_bZOjE' }}
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: SKILLBRIDGE/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: SKILLBRIDGE

      - name: Lint SkillBridge Web App
        run: npm run lint --workspace=@skillbridge/web
        working-directory: SKILLBRIDGE

      - name: Type Check SkillBridge Web App
        run: npm run type-check --workspace=@skillbridge/web
        working-directory: SKILLBRIDGE

      - name: Build SkillBridge Main Workspace
        run: npx turbo run build --filter=@skillbridge/web
        working-directory: SKILLBRIDGE

      - name: Test SkillBridge Web App
        run: npm run test --workspace=@skillbridge/web
        working-directory: SKILLBRIDGE

      - name: Deploy to Vercel (Production)
        if: vars.ENABLE_VERCEL_DEPLOY == 'true'
        run: |
          deploy_dir="$RUNNER_TEMP/skillbridge-web"
          rm -rf "$deploy_dir"
          mkdir -p "$deploy_dir"
          rsync -a --exclude 'node_modules' --exclude '.next' --exclude 'vercel.json' SKILLBRIDGE/apps/web/ "$deploy_dir/"
          cd "$deploy_dir"
          npx vercel@latest . --prod --yes --token "$VERCEL_TOKEN" --build-env "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" --build-env "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify live production endpoint
        run: curl --fail --silent --show-error --max-time 30 --retry 3 https://skillbridge-vercel-web.vercel.app/
