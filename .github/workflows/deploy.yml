name: Cloud Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy-web:
    name: Build & Deploy Web App
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4
      - name: Initialize Production Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble Linked Workspace Dependencies
        run: npm install --include=dev --legacy-peer-deps --no-audit --no-fund
      - name: Compile Optimized Next.js Core
        cwd: apps/web
        run: npm run build --if-present
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_f21PTSo3zKr1oayFCTTyxA_yn6C7QKo"
          SUPABASE_SERVICE_ROLE_KEY: "dummy_build_service_key"
      - name: Push Production Release Live to Vercel
        cwd: apps/web
        run: npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --name=skillbridge-web
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_f21PTSo3zKr1oayFCTTyxA_yn6C7QKo"

  verify-modules:
    name: Verify Multiplatform Modules
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4
      - name: Initialize Production Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble Linked Workspace Dependencies
        run: npm install --include=dev --legacy-peer-deps --no-audit --no-fund
      - name: Verify Workspace Compilations
        run: npm run build --if-present
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_f21PTSo3zKr1oayFCTTyxA_yn6C7QKo"
