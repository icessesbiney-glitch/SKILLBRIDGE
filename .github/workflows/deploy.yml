name: Cloud Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Project Workspace Dependencies
        run: npm install
      - name: Build Optimized Production Core Assets
        run: npx next build apps/web
      - name: Install Global Deployment Engine
        run: npm install -g vercel
      - name: Push Compiled Static Pages Live
        run: vercel deploy --prebuilt --prod --cwd apps/web --yes --token=${{ secrets.VERCEL_TOKEN }}
