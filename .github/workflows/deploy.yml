name: Cloud Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    name: Build & Deploy Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Initialize Production Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Inject Local Application Environmental Properties
        run: |
          mkdir -p apps/web
          echo "NEXT_PUBLIC_SUPABASE_URL=https://supabase.co" > apps/web/.env
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_f21PTSo3zKr1oayFCTTyxA_yn6C7QKo" >> apps/web/.env

      - name: Assemble Linked Monorepo Workspace Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Compile Optimized Next.js Core via Workspace Root Target
        run: npx turbo run build --filter=@skillbridge/web...
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_f21PTSo3zKr1oayFCTTyxA_yn6C7QKo"

      - name: Push Production Release Live to Vercel
        run: npx vercel deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
