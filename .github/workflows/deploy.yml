name: Cloud Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy-web:
    name: Build & Deploy Web App
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4
      - name: Initialize Production Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Provision High-Performance Build Engine
        run: npm install -g turbo
      - name: Assemble Linked Workspace Dependencies
        run: npm install --include=dev --legacy-peer-deps --no-audit --no-fund
      - name: Inject Non-Interactive Vercel Project Metadata Links
        run: |
          mkdir -p .vercel apps/web/.vercel
          echo '{"orgId":"link-the-ink","projectId":"skillbridge"}' > .vercel/project.json
          echo '{"orgId":"link-the-ink","projectId":"skillbridge"}' > apps/web/.vercel/project.json
      - name: Compile Optimized Production Web Core
        run: turbo run build --filter=@skillbridge/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://aolfuonsuaeoitumuvqc.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_f21PTSo3zKr1oayFCTTyxA_yn6C7QKo"
          SUPABASE_SERVICE_ROLE_KEY: "dummy_build_service_key"
          VERCEL_ORG_ID: "link-the-ink"
          VERCEL_PROJECT_ID: "skillbridge"
          TURBO_TELEMETRY_DISABLED: "1"
          NEXT_TELEMETRY_DISABLED: "1"
          DEPLOYED_BY: "Joshua Biney"
      - name: Push Prebuilt Production Release Live
        run: npx vercel deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/web

  build-desktop:
    name: Verify Desktop Core
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4
      - name: Initialize Production Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Provision High-Performance Build Engine
        run: npm install -g turbo
      - name: Assemble Linked Workspace Dependencies
        run: npm install --include=dev --legacy-peer-deps --no-audit --no-fund
      - name: Compile Desktop Workspace Production Layout
        run: turbo run build --filter=@skillbridge/desktop --if-present
        env:
          TURBO_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "https://aolfuonsuaeoitumuvqc.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_f21PTSo3zKr1oayFCTTyxA_yn6C7QKo"

  build-mobile:
    name: Verify Mobile Core
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4
      - name: Initialize Production Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Provision High-Performance Build Engine
        run: npm install -g turbo
      - name: Assemble Linked Workspace Dependencies
        run: npm install --include=dev --legacy-peer-deps --no-audit --no-fund
      - name: Compile Mobile Expo Application Bundle
        run: turbo run build --filter=@skillbridge/mobile --if-present
        env:
          TURBO_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "https://aolfuonsuaeoitumuvqc.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_f21PTSo3zKr1oayFCTTyxA_yn6C7QKo"
