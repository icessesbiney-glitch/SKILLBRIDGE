name: Cloud Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Pull Vercel Project Settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: 'team_link-the-ink'
          VERCEL_PROJECT_ID: 'skillbridge-web'
      - name: Build and Push Live to Production
        run: vercel deploy --prod --cwd apps/web --yes --token=${{ secrets.VERCEL_TOKEN }}
