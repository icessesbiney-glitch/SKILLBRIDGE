name: Cloud Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    name: Build & Deploy Application
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4
      - name: Initialize Production Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble Linked Project Dependencies
        run: npm install --include=dev --legacy-peer-deps --no-audit --no-fund
      - name: Compile Optimized Next.js Core
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://aolfuonsuaeoitumuvqc.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_f21PTSo3zKr1oayFCTTyxA_yn6C7QKo"
          SUPABASE_SERVICE_ROLE_KEY: "dummy_build_service_key"
      - name: Push Production Release Live to Vercel
        run: npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://aolfuonsuaeoitumuvqc.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_f21PTSo3zKr1oayFCTTyxA_yn6C7QKo"
