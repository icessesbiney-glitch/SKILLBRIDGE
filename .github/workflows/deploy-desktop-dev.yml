name: Deploy Desktop - Development Build

on:
  push:
    branches: [develop]
    paths:
      - 'apps/desktop/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-desktop-dev.yml'
  workflow_dispatch:

jobs:
  build-desktop-dev:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            build-cmd: npm run dist:desktop:linux
            output-pattern: 'dist/*.AppImage'
            output-name: 'SkillBridge-linux-dev'
          - os: macos-latest
            build-cmd: npm run dist:desktop:mac
            output-pattern: 'dist/*.dmg'
            output-name: 'SkillBridge-mac-dev'
          - os: windows-latest
            build-cmd: npm run dist:desktop:win
            output-pattern: 'dist/*.exe'
            output-name: 'SkillBridge-windows-dev'

    runs-on: ${{ matrix.os }}
    environment: desktop-dev

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Type check desktop app
        run: npm run type-check --workspace=@skillbridge/desktop

      - name: Build desktop app (${{ matrix.os }})
        working-directory: apps/desktop
        run: ${{ matrix.build-cmd }}

      - name: Upload development builds
        uses: actions/upload-artifact@v3
        with:
          name: desktop-builds-dev-${{ matrix.os }}
          path: apps/desktop/${{ matrix.output-pattern }}
          retention-days: 14

  create-dev-release:
    needs: build-desktop-dev
    runs-on: ubuntu-latest
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: ./builds

      - name: Create development release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().split('T')[0];
            
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `✅ Desktop app development builds completed (${date})\n\n🖥️ Platforms:\n- Windows (.exe)\n- macOS (.dmg)\n- Linux (.AppImage)\n\n📥 Downloads available in artifacts (14 day retention)\n\n⚠️ Development builds - not for production use`
            })
