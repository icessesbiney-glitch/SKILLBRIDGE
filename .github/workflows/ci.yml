name: Node.js CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: SKILLBRIDGE/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: SKILLBRIDGE

      - name: Run Turborepo Validation Pipeline
        run: npx turbo run build lint test
        working-directory: SKILLBRIDGE
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock_build_unblocker
