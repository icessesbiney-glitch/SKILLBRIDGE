<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - SkillBridge</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .container {
      text-align: center;
      color: white;
      padding: 20px;
    }
    h1 {
      font-size: 2em;
      margin: 0;
    }
    p {
      font-size: 1.1em;
      margin: 10px 0;
      opacity: 0.9;
    }
    .icon {
      font-size: 3em;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>SkillBridge is currently unavailable without an internet connection.</p>
    <p>Please check your connection and try again.</p>
  </div>
</body>
</html>
